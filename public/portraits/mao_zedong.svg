<title id="title">毛泽东 · 风云令</title>
<desc id="desc">原创 SVG 卡牌插画：参考毛泽东绘画艺术形象重绘，高额头与后退发际线、后梳的两侧头发、较窄的眼睛和眼袋、宽鼻翼、闭合嘴唇、圆钝下颌与下唇下方的痣；保持蓝灰中山装、山河、环形光纹与书卷构图。</desc>
