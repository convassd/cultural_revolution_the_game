  <title id="title">邓小平 · 再起</title>
  <desc id="desc">原创矢量卡牌插画：邓小平着深蓝灰色中山装，宽短脸、饱满下颌、后退的灰短发、厚眼睑和明显眼袋；背景三道微亮的环形光带呼应复出机制，前景有工作台齿轮。</desc>
