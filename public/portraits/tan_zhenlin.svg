<defs>
    <linearGradient id="bg" x2="1" y2=".8"><stop stop-color="#b5b49c"/><stop offset=".5" stop-color="#4a6c7b"/><stop offset="1" stop-color="#21354c"/></linearGradient>
    <radialGradient id="halo" cx=".43" cy=".27" r=".72"><stop stop-color="#f5db97" stop-opacity=".65"/><stop offset=".55" stop-color="#4a6c7b" stop-opacity=".05"/><stop offset="1" stop-color="#21354c" stop-opacity=".7"/></radialGradient>
    <linearGradient id="cloth" x2="1" y2=".7"><stop stop-color="#89979a"/><stop offset=".4" stop-color="#445d69"/><stop offset="1" stop-color="#243e51"/></linearGradient>
