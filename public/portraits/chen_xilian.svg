    <radialGradient id="halo" cx=".52" cy=".24" r=".72"><stop stop-color="#eaca82" stop-opacity=".75"/><stop offset=".52" stop-color="#71917a" stop-opacity=".2"/><stop offset="1" stop-color="#12252b" stop-opacity=".65"/></radialGradient>
