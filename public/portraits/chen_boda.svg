<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">陈伯达 · 墨与纸</title>
  <desc id="desc">原创矢量卡牌插画：戴圆框眼镜和布帽的陈伯达，暖光照亮面部，身前是书页与钢笔，背景为暗红色的纸张和墨迹。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#251d2c"/><stop offset=".55" stop-color="#762f32"/><stop offset="1" stop-color="#1c2930"/></linearGradient>
    <radialGradient id="halo" cx=".43" cy=".38" r=".7"><stop stop-color="#efb65f" stop-opacity=".7"/><stop offset=".55" stop-color="#bd5942" stop-opacity=".12"/><stop offset="1" stop-color="#141f27" stop-opacity=".75"/></radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#727876"/><stop offset=".35" stop-color="#37494a"/><stop offset=".75" stop-color="#1c3037"/><stop offset="1" stop-color="#132029"/></linearGradient>
    <linearGradient id="skin" x1="0" y1=".15" x2="1" y2=".6"><stop stop-color="#fff0ba"/><stop offset=".35" stop-color="#e9bc85"/><stop offset=".68" stop-color="#b97c62"/><stop offset="1" stop-color="#654a4b"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a49e81"/><stop offset=".45" stop-color="#626e66"/><stop offset="1" stop-color="#273b3c"/></linearGradient>
    <linearGradient id="paper" x2=".2" y2="1"><stop stop-color="#fff1b6"/><stop offset="1" stop-color="#ba9663"/></linearGradient>
    <radialGradient id="vignette"><stop offset=".58" stop-opacity="0"/><stop offset="1" stop-color="#121b25" stop-opacity=".65"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
    <clipPath id="frame"><rect width="600" height="360" rx="8"/></clipPath>
  </defs>
