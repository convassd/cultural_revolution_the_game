    <linearGradient id="cloth" x2="1" y2=".7"><stop stop-color="#89979a"/><stop offset=".4" stop-color="#445d69"/><stop offset="1" stop-color="#243e51"/></linearGradient>
    <linearGradient id="skin" x1="0" y1=".2" x2="1" y2=".7"><stop stop-color="#ffe7af"/><stop offset=".35" stop-color="#e5b582"/><stop offset=".7" stop-color="#b98265"/><stop offset="1" stop-color="#74544b"/></linearGradient>
